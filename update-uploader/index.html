<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="2;url=https://shen-yue-update-cloud.netlify.app/">
  <title>申悅更新中心｜前往永久雲端版</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at top, #182a43, #07101d 64%); color: #f4f8ff; }
    main { width: min(92vw, 560px); padding: 42px; border: 1px solid #284562; border-radius: 24px; background: rgba(12, 25, 42, .92); box-shadow: 0 24px 80px rgba(0,0,0,.38); text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; background: #48d4a0; color: #07131a; font-size: 28px; font-weight: 900; }
    h1 { margin: 22px 0 10px; font-size: clamp(26px, 6vw, 38px); }
    p { color: #b8c9dc; line-height: 1.8; }
    a { display: inline-flex; margin-top: 14px; padding: 13px 22px; border-radius: 13px; background: #48d4a0; color: #06151a; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="mark">✓</span>
    <h1>已升級為永久雲端版</h1>
    <p>舊的一鍵上傳網址會自動帶你前往新站；新站不依賴家中主機，電腦關機也能使用。</p>
    <a id="go" href="https://shen-yue-update-cloud.netlify.app/">立即前往申悅更新中心</a>
  </main>
  <script>
    const target = new URL("https://shen-yue-update-cloud.netlify.app/");
    const source = new URL(location.href);
    const key = source.searchParams.get("key") || source.searchParams.get("k");
    if (key) target.searchParams.set("key", key);
    document.querySelector("#go").href = target.href;
    setTimeout(() => location.replace(target.href), 900);
  </script>
</body>
</html>
